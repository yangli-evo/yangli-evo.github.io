bio: >-
  I am a Postdoctoral Fellow at the University of Michigan, working with
  [Prof. Jianzhi Zhang](https://websites.umich.edu/~zhanglab/Research.html).
  I use computational biology to study the mechanisms and processes that shape
  biological evolution. I am always happy to discuss collaborations, so feel free
  to get in touch.

interests:
  - title: Genome Evolution & Phylogenetics
    text: >-
      Large-scale genomic data to resolve relationships among species and to
      understand how genome rearrangements and duplications drive diversity and
      adaptation.
  - title: Fitness Landscapes
    text: >-
      Landscape navigability, accessibility of high peaks, epistasis, and the
      adaptive walks that determine evolutionary trajectories.
  - title: Horizontal Gene Transfer
    text: >-
      How foreign genes enter, integrate, and adapt within host genomes, and how
      these transfers reshape genomic diversity and the tree of life.
    link: /pdf/Cell2022.pdf
